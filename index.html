<style>
:root{
  --bg:#fbf6f8;--bg-blur:rgba(251,246,248,.86);--surface:#fff;--surface2:#f7eef2;--border:#f0e2e9;--border-strong:#dcc5d1;
  --text:#2a1f26;--muted:#7a6a73;--accent:#d6457f;--accent-soft:#fce6ef;
  --ok:#2c9f68;--ok-soft:#e2f4ea;--warn:#c98318;--warn-soft:#fbf0dc;--bad:#d64b47;--bad-soft:#fbe6e5;
  --c-work:#d6457f;--c-fac:#8b5cd6;--c-read:#d08a1e;--c-gym:#e2604f;--c-food:#2f9e5f;--c-trib:#1597b0;--c-lang:#5b7fe0;--c-water:#2a9fd8;--c-tea:#6b9a36;--c-other:#9a8a93;
  color-scheme:light;--r:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#141015;--bg-blur:rgba(20,16,21,.86);--surface:#1d171e;--surface2:#29202a;--border:#352a36;--border-strong:#4a3c4b;
  --text:#f1e8ee;--muted:#a898a2;--accent:#f27aa9;--accent-soft:#3d1f2e;
  --ok:#4cc38a;--ok-soft:#183026;--warn:#e6a94f;--warn-soft:#352a17;--bad:#f07470;--bad-soft:#3a1f1f;
  --c-work:#f27aa9;--c-fac:#ae8df2;--c-read:#e6a94f;--c-gym:#f08a7a;--c-food:#4cc38a;--c-trib:#3cc0d8;--c-lang:#89a3f5;--c-water:#5bbce9;--c-tea:#9cc56a;--c-other:#9a8a93;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
svg{display:block}
.app{display:flex;min-height:100vh;min-height:100dvh}
.main{flex:1;min-width:0}
.side{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg-blur);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.top h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.top .sub{font-size:12.5px;color:var(--muted)}
.iconbtn{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text);padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.sm{width:32px;height:32px;border-radius:8px}
.iconbtn.sm svg{width:15px;height:15px}

function merge(def,src){
  if(Array.isArray(def))return Array.isArray(src)?src:def;
  if(def&&typeof def==='object'){const o={...def};if(src&&typeof src==='object'&&!Array.isArray(src))for(const k in src)o[k]=(k in def)?merge(def[k],src[k]):src[k];return o;}
  return src===undefined?def:src;
}
let S;
function migrate(){
  if((S.v||1)<2){
    if(!num(S.food.goal))S.food.goal=1300;
    const have=new Set(S.food.custom.map(c=>norm(c.n)));
    MY_FOODS.forEach(f=>{if(!have.has(norm(f.n)))S.food.custom.push({id:uid(),...f});});
    if(!S.food.weights.length)S.food.weights.push({id:uid(),date:today(),kg:55});
    S.v=2;save();
  }
}

function urg(i,k){
  if(i.status==='feito'||!i.due)return['',''];
  const d=diffD(k,i.due);
  if(d<0)return['late',`Atrasado há ${plural(-d,'dia')}`];
  if(d===0)return['today','Vence hoje'];
  if(d===1)return['soon','Vence amanhã'];
  if(d<=3)return['soon',`Vence em ${d} dias`];
  if(d<=7)return['week',`Em ${d} dias`];
  return['',''];
}

function barChart(data,c){
  const W=320,H=120,P=16,max=Math.max(1,...data.map(d=>d.v)),bw=W/data.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${P+H+22}" role="img">${data.map((d,i)=>{const bh=d.v/max*H,x=i*bw+bw*.2,w=bw*.6,y=P+H-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(bh,d.v?2:0).toFixed(1)}" rx="4" fill="${c}"/>${d.v?`<text class="v" x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle">${fmtN(d.v)}</text>`:''}<text x="${(x+w/2).toFixed(1)}" y="${P+H+15}" text-anchor="middle">${d.l}</text>`;}).join('')}<line x1="0" x2="${W}" y1="${P+H+.5}" y2="${P+H+.5}"/></svg>`;
}
function lineChart(pts,c,goal){
  if(pts.length<2)return '<div class="empty">Registre o peso pelo menos 2 vezes (de preferência no mesmo dia da semana) para ver o gráfico.</div>';
  const W=320,H=150,L=36,R=12,T=14,B=24;const vs=pts.map(p=>p.v).concat(goal?[goal]:[]);let mn=Math.min(...vs),mx=Math.max(...vs);
  if(mx-mn<1){mn-=.5;mx+=.5;}const pd=(mx-mn)*.15;mn-=pd;mx+=pd;
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><text x="${L-6}" y="${T+3}" text-anchor="end">${fmtN(mx,1)}</text><text x="${L-6}" y="${H-B+3}" text-anchor="end">${fmtN(mn,1)}</text>${goal?`<line x1="${L}" x2="${W-R}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}" style="stroke:var(--accent)" stroke-dasharray="4 4"/><text x="${L+4}" y="${(y(goal)-4).toFixed(1)}" style="fill:var(--accent)">meta ${fmtN(goal,1)} kg</text>`:''}<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${c}"/>`).join('')}<text class="v" x="${x(pts.length-1).toFixed(1)}" y="${(y(pts[pts.length-1].v)-8).toFixed(1)}" text-anchor="end">${fmtN(pts[pts.length-1].v,1)} kg</text><text x="${L}" y="${H-6}">${pts[0].l}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${pts[pts.length-1].l}</text></svg>`;
}

const curW=()=>{const ws=[...S.food.weights].sort((a,b)=>a.date.localeCompare(b.date));return ws.length?num(ws[ws.length-1].kg):num(S.body.startWeight);};
const bmiOf=kg=>{const h=num(S.body.height)/100;return h?kg/(h*h):0;};
const bmiCat=b=>b<18.5?'abaixo do adequado':b<25?'adequado':b<30?'sobrepeso':'obesidade';
const tmb=kg=>10*kg+6.25*num(S.body.height)-5*num(S.body.age)+(S.body.sex==='m'?5:-161);
const waterGoal=()=>Math.round(curW()*(num(S.water.mlkg)||35));
const waterLog=k=>S.water.log[k]||{ml:0,adds:[]};
function avatar(bmi,goal){
  const B=S.body,k=Math.max(.82,Math.min(1.35,1+(bmi-21.5)*.065)),sk=(SKIN[B.skin]||SKIN[0])[1],hr=(HAIR[B.hair]||HAIR[0])[1],f=B.sex!=='m',cx=60;
  const sw=17*k,ww=12.5*k,hw=(f?23:15)*k,cl=goal?'var(--accent-soft)':'var(--accent)',st=goal?' stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"':'';
  const leg=(f?sk:'#4a4e69'),lw=(f?7.5:10)*k;
  let g='';
  if(f)g+=`<path d="M41 44 Q37 92 45 102 L75 102 Q83 92 79 44 Z" fill="${hr}"/>`;
  g+=`<path d="M${cx-sw+3} 76 L${cx-sw-5*k} 124" stroke="${sk}" stroke-width="${7*k}" stroke-linecap="round"/><path d="M${cx+sw-3} 76 L${cx+sw+5*k} 124" stroke="${sk}" stroke-width="${7*k}" stroke-linecap="round"/>`;
  g+=`<path d="M${cx-6*k} 140 L${cx-7*k} 192" stroke="${leg}" stroke-width="${lw}" stroke-linecap="round"/><path d="M${cx+6*k} 140 L${cx+7*k} 192" stroke="${leg}" stroke-width="${lw}" stroke-linecap="round"/>`;
  g+=`<ellipse cx="${cx-8*k}" cy="196" rx="6.5" ry="3.2" fill="#5b3a48"/><ellipse cx="${cx+8*k}" cy="196" rx="6.5" ry="3.2" fill="#5b3a48"/>`;
  g+=`<rect x="${cx-4}" y="56" width="8" height="14" rx="3" fill="${sk}"/>`;
  g+=f?`<path d="M${cx-sw} 72 Q${cx} 66 ${cx+sw} 72 L${cx+ww} 110 L${cx+hw} 150 Q${cx} 156 ${cx-hw} 150 L${cx-ww} 110 Z" fill="${cl}"${st}/>`
      :`<path d="M${cx-ww-2} 116 L${cx+ww+2} 116 L${cx+ww} 142 L${cx-ww} 142 Z" fill="#4a4e69"/><path d="M${cx-sw} 72 Q${cx} 66 ${cx+sw} 72 L${cx+ww+2} 120 L${cx-ww-2} 120 Z" fill="${cl}"${st}/>`;
  g+=`<circle cx="${cx}" cy="42" r="18" fill="${sk}"/>`;
  g+=`<circle cx="53.5" cy="44" r="1.9" fill="#2b1d22"/><circle cx="66.5" cy="44" r="1.9" fill="#2b1d22"/><path d="M55 50.5 Q60 54.5 65 50.5" stroke="#2b1d22" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="50" cy="49" r="3" fill="#ff6f9c" opacity=".35"/><circle cx="70" cy="49" r="3" fill="#ff6f9c" opacity=".35"/>`;
  g+=f?`<path d="M42 41 Q43 22 60 22 Q78 22 79 42 Q71 30 57 32 Q48 33 42 41 Z" fill="${hr}"/>`:`<path d="M42 40 Q42 22 60 22 Q78 22 78 40 Q72 30 60 30 Q48 30 42 40 Z" fill="${hr}"/>`;
  return `<svg viewBox="0 0 120 202" role="img" aria-label="Avatar"${goal?' style="opacity:.92"':''}>${g}</svg>`;
}

V.hoje=()=>{
  const now=new Date(),k=dkey(now),w=wd(now),wk=wStart(now),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  let tot=0,dn=0;const cnt=d=>{tot++;if(d)dn++;};
  const wt=sortT(S.work.tasks.filter(t=>t.week===wk&&t.day===w));
  const wl=sortT(S.work.tasks.filter(t=>t.week===wk&&t.day<w&&t.status!=='feito'));
  wt.forEach(t=>cnt(t.status==='feito'));wl.forEach(()=>cnt(false));
  const t3=top3(k).map((x,i)=>({...x,i})).filter(x=>x.t&&x.t.trim());t3.forEach(x=>cnt(x.d));
  const fT=S.fac.items.filter(i=>i.due&&(i.due===k||(i.due<k&&i.status!=='feito'))).sort(byDue);fT.forEach(i=>cnt(i.status==='feito'));
  const k3=dkey(addD(now,3));const fS=S.fac.items.filter(i=>i.due&&i.due>k&&i.due<=k3&&i.status!=='feito').sort(byDue);

  const tp=S.tea.plan[w]||{},tdn=S.tea.done[k]||{};if(tp.m)cnt(!!tdn.m);if(tp.n)cnt(!!tdn.n);
  const ents=S.food.meals[k]||[],kc=sum(ents.map(e=>e.kcal)),goal=num(S.food.goal);
  const rl=S.read.log[k]||{m:0,d:false};cnt(!!rl.d);
  const tDay=S.trib.days.includes(w);if(tDay)cnt(!!S.trib.done[k]);
  S.lang.list.forEach(l=>cnt(!!(l.done||{})[k]));

  let h=`<div class="card hero"><div class="row"><div class="grow"><div class="dow">${DOWF[now.getDay()]}</div><div class="date">${now.getDate()} de ${MES[now.getMonth()]} de ${now.getFullYear()}</div></div><div class="pct">${pct}<small>%</small></div></div>${bar(pct,'var(--ok)')}<div class="small muted" style="margin-top:8px">${dn} de ${tot} itens concluídos hoje</div></div>`;
  h+='<div class="grid g2">';
  // grade
  h+=`<div class="card">${h2('Grade de hoje','var(--accent)')}${blocks.length?`<div class="tl">${blocks.map(b=>{const st=hm>=b.end?'past':hm>=b.start?'now':'';
    return `<div class="blk ${st}" style="--c:${KC[b.kind]||KC.other}"><span class="time">${ft(b.start)} às ${ft(b.end)}</span><span class="grow">${esc(b.label)}</span>${st==='now'?'<span class="pill s-andamento">agora</span>':''}</div>`;}).join('')}</div>`:'<div class="empty">Nenhum compromisso fixo hoje.</div>'}<details class="wk"><summary>Ver grade da semana ›</summary>${weekGrid()}</details></div>`;
  // trabalho
  h+=`<div class="card">${h2('Trabalho',C.work,more('trabalho'))}`;
  h+=t3.length?`<div class="sublbl" style="margin-top:0">3 prioridades do dia</div>`+t3.map(x=>`<div class="item${x.d?' done':''}">${chk(x.d,'t3t',`data-date="${k}" data-i="${x.i}"`)}<div class="grow"><div class="ttl">${esc(x.t)}</div></div></div>`).join(''):`<button class="link" data-a="go" data-tab="trabalho">+ Definir as 3 prioridades do dia</button>`;
  h+=`<div class="sublbl">Tarefas de hoje</div>`+(wt.length?wt.map(t=>wRow(t)).join(''):'<div class="empty">Nenhuma tarefa para hoje.</div>');
  if(wl.length)h+=`<div class="sublbl warn">Pendentes de dias anteriores</div>`+wl.map(t=>wRow(t,true)).join('');
  h+='</div>';
  // faculdade
  h+=`<div class="card">${h2('Faculdade',C.fac,more('faculdade'))}${fT.length?fT.map(i=>fRow(i,k)).join(''):'<div class="empty">Nada vencendo hoje.</div>'}${fS.length?'<div class="sublbl">Vence em breve</div>'+fS.map(i=>fRow(i,k)).join(''):''}</div>`;
  // alimentação
  h+=`<div class="card">${h2('Alimentação',C.food,more('alimentacao'))}<div class="row" style="margin-bottom:8px"><div class="grow"><b class="big">${fmtN(kc)}</b> <span class="muted">${goal?`de ${fmtN(goal)} kcal`:'kcal hoje'}</span></div><span class="small muted">${goal?(kc<=goal?`faltam ${fmtN(goal-kc)} kcal`:`${fmtN(kc-goal)} kcal acima`):'<button class="link" data-a="go" data-tab="alimentacao">definir meta</button>'}</span></div>${goal?bar(kc/goal*100,kc>goal?'var(--warn)':C.food):''}`;
  h+=S.food.slots.map(s=>{const se=ents.filter(e=>e.meal===s);
    return `<div class="item"><div class="grow"><div class="ttl">${MEALS[s]}</div><div class="meta">${se.length?`<span class="trunc">${esc(se.map(e=>e.name).join(', '))}</span><span>${fmtN(sum(se.map(e=>e.kcal)))} kcal</span>`:'nada registrado'}</div></div><button class="iconbtn sm" data-a="foodadd" data-meal="${s}" data-date="${k}" aria-label="Adicionar alimento">${I.plus}</button></div>`;}).join('');
  h+='</div>';
  // chá e água
  const teaRow=(p,lb)=>tp[p]?`<div class="item${tdn[p]?' done':''}">${chk(!!tdn[p],'tea',`data-p="${p}" data-date="${k}"`)}<div class="grow"><div class="ttl">${lb}: ${esc(tp[p])}</div><div class="meta">${esc(tp[p+'d']||'')}${p==='m'&&tp.tag?` <span class="pill s-andamento">${esc(tp.tag)}</span>`:''}</div></div></div>`:'';

  // treino
  h+=`<div class="card">${h2('Exercícios',C.gym,more('exercicios'))}${plan.length?`<div class="item${S.gym.done[k]?' done':''}">${chk(!!S.gym.done[k],'gd',`data-date="${k}" data-d="${w}"`)}<div class="grow"><div class="ttl">${esc(S.gym.labels[w]||'Treino de '+DIAS[w].toLowerCase())}</div><div class="meta">${plan.map(e=>esc(e.name)+(e.sets||e.reps?` ${esc(e.sets||'?')}×${esc(e.reps||'?')}`:'')).join(' · ')}</div></div></div>`:`<div class="empty">Nenhum treino planejado para ${DIAS[w].toLowerCase()}. <button class="link" data-a="go" data-tab="exercicios">Planejar</button></div>`}</div>`;
  // leitura
  const lendo=S.read.books.filter(b=>b.status==='lendo'),rg=num(S.read.goal)||1;
  h+=`<div class="card">${h2('Leitura',C.read,more('leitura'))}<div class="item${rl.d?' done':''}">${chk(!!rl.d,'rd',`data-date="${k}"`)}<div class="grow"><div class="ttl">Ler ${fmtN(S.read.goal)} min</div><div class="meta"><span>hoje: ${rl.m||0} min</span>${lendo.length?`<span class="trunc">${esc(lendo.map(b=>b.title).join(', '))}</span>`:''}</div>${bar((rl.m||0)/rg*100,C.read)}</div><button class="btn sm" data-a="ra" data-m="10">+10 min</button></div></div>`;
  // tributário
  const nm=S.trib.modules.find(m=>m.status!=='concluido');
  h+=`<div class="card">${h2('Direito Tributário',C.trib,more('tributario'))}`;
  if(!S.trib.days.length)h+=`<div class="empty">Defina o dia e o horário de estudo. <button class="link" data-a="go" data-tab="tributario">Definir</button></div>`;
  else if(tDay)h+=`<div class="item${S.trib.done[k]?' done':''}">${chk(!!S.trib.done[k],'td',`data-date="${k}"`)}<div class="grow"><div class="ttl">Estudar tributário${S.trib.time?' às '+ft(S.trib.time):''}${S.trib.dur?` (${fmtN(num(S.trib.dur),1)} h)`:''}</div><div class="meta">${nm?'Próxima aula: '+esc(nm.title):'Cadastre as aulas do curso'}</div></div></div>`;
  else{const nx=nextDay(S.trib.days,w);h+=`<div class="empty">Hoje não é dia de estudo. Próximo: ${DIAS[nx].toLowerCase()}${S.trib.time?' às '+ft(S.trib.time):''}.${nm?' Próxima aula: '+esc(nm.title)+'.':''}</div>`;}
  h+='</div>';
  // idiomas
  h+=`<div class="card">${h2('Idiomas',C.lang,more('idiomas'))}${S.lang.list.map(l=>{const wm=langWeekMin(l,wk),g=num(l.goalMin),on=!!(l.done||{})[k];
    return `<div class="item${on?' done':''}">${chk(on,'ld',`data-id="${l.id}" data-date="${k}"`)}<div class="grow"><div class="ttl">${l.flag||''} Praticar ${esc(l.name.toLowerCase())}</div><div class="meta">${fmtN(wm)} min nesta semana${g?` de ${fmtN(g)}`:''}</div>${g?bar(wm/g*100,C.lang):''}</div><button class="btn sm" data-a="sadd" data-id="${l.id}">+ Sessão</button></div>`;}).join('')}</div>`;
  h+='</div>';
  const le=S.meta.lastExport;
  if(!le||diffD(le,k)>=14)h+=`<div class="tip">Último backup: ${le?fdy(le):'nunca'}.<button data-a="go" data-tab="ajustes">Fazer backup</button></div>`;
  return h;
};

/* ---------- TRABALHO ---------- */
function quickW(withDay){
  return `<div class="qa"><input class="in" id="wq" data-enter="wadd" placeholder="Nova tarefa..." enterkeyhint="done" autocomplete="off"><div class="row">${withDay?`<select class="in" id="wqd" aria-label="Dia">${D7.map(i=>`<option value="${i}"${i===wd(new Date())?' selected':''}>${DC[i]}</option>`).join('')}</select>`:''}<select class="in" id="wqp" aria-label="Prioridade"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select><button class="btn pri" data-a="wadd" aria-label="Adicionar">${I.plus}</button></div></div>`;
}
V.trabalho=()=>{
  const wk=UI.wWeek,ws=pk(wk),cur=wStart(new Date()),k=today();
  const tasks=S.work.tasks.filter(t=>t.week===wk);
  let h=`<div class="toolbar"><div class="row"><button class="iconbtn" data-a="ww" data-d="-1" aria-label="Semana anterior">${I.l}</button><div class="wkl"><div class="small muted">${wk===cur?'Esta semana':'Semana'}</div><b>${fd(ws)} a ${fd(addD(ws,6))}</b></div><button class="iconbtn" data-a="ww" data-d="1" aria-label="Próxima semana">${I.r}</button>${wk!==cur?'<button class="btn sm ghost" data-a="ww" data-d="0">Voltar a hoje</button>':''}</div><div class="seg"><button class="${UI.wView==='dia'?'on':''}" data-a="wv" data-v="dia">Por dia</button><button class="${UI.wView==='semana'?'on':''}" data-a="wv" data-v="semana">Semana toda</button></div></div>`;
  if(UI.wView==='dia'){
    const d=UI.wDay,dk=dkey(addD(ws,d-1));
    h+=`<div class="chips scroll" style="margin-bottom:14px">${D7.map(i=>{const p=tasks.filter(t=>t.day===i&&t.status!=='feito').length,isT=dkey(addD(ws,i-1))===k;
      return `<button class="chip${i===d?' on':''}${isT?' today':''}" data-a="wd" data-d="${i}">${DC[i]} <span class="n">${fd(addD(ws,i-1))}</span>${p?`<span class="badge">${p}</span>`:''}</button>`;}).join('')}</div>`;
    const t3=top3(dk),dt=sortT(tasks.filter(t=>t.day===d));
    h+=`<div class="grid g2"><div class="card">${h2('3 prioridades do dia',C.work,`<span class="cnt">${DIAS[d]}, ${fd(dk)}</span>`)}${t3.map((x,i)=>`<div class="item${x.d?' done':''}" style="align-items:center">${chk(x.d,'t3t',`data-date="${dk}" data-i="${i}"`)}<span class="num">${i+1}</span><input class="in plain" data-c="t3x" data-date="${dk}" data-i="${i}" value="${esc(x.t)}" placeholder="Prioridade ${i+1}" enterkeyhint="done"></div>`).join('')}</div>`;
    h+=`<div class="card">${h2(`Tarefas de ${DIAS[d].toLowerCase()}`,C.work,`<span class="cnt">${dt.filter(t=>t.status==='feito').length}/${dt.length} feitas</span>`)}${quickW(false)}${dt.length?dt.map(t=>wRow(t)).join(''):'<div class="empty">Nenhuma tarefa. Digite acima e toque em +.</div>'}</div></div>`;
  }else{
    h+=`<div class="card">${h2('Tarefas da semana',C.work,`<span class="cnt">${tasks.filter(t=>t.status==='feito').length}/${tasks.length} feitas</span>`)}${quickW(true)}`;
    D7.forEach(d=>{const dt=sortT(tasks.filter(t=>t.day===d));if(dt.length)h+=`<div class="sublbl">${DIAS[d]} · ${fd(addD(ws,d-1))}</div>`+dt.map(t=>wRow(t)).join('');});
    if(!tasks.length)h+='<div class="empty">Nenhuma tarefa nesta semana.</div>';
    h+='</div>';
  }
  const pend=sortT(tasks.filter(t=>t.status!=='feito')),done=tasks.length-pend.length;
  h+=`<div class="card">${h2('Revisão semanal',C.work)}<div class="stats"><div><b>${tasks.length}</b><span>tarefas</span></div><div><b>${done}</b><span>feitas</span></div><div><b class="${pend.length?'t-warn':''}">${pend.length}</b><span>pendentes</span></div></div>${tasks.length?`<div style="margin-top:12px">${bar(done/tasks.length*100,'var(--ok)')}</div>`:''}${pend.length?'<div class="sublbl">Pendências</div>'+pend.map(t=>wRow(t,true)).join(''):''}<label class="f" style="margin-top:12px">Anotações da revisão<textarea class="in" data-i="wrev" data-week="${wk}" rows="4" placeholder="O que ficou pendente, o que travou, o que levar para a próxima semana...">${esc(S.work.review[wk]||'')}</textarea></label>${pend.length?`<button class="btn" style="margin-top:10px" data-a="wmove">Mover ${plural(pend.length,'pendência')} para a próxima semana</button>`:''}</div>`;
  return h;
};

/* ---------- FACULDADE ---------- */
V.faculdade=()=>{
  const k=today(),open=S.fac.items.filter(i=>i.status!=='feito');
  const late=open.filter(i=>i.due&&i.due<k).length,soon=open.filter(i=>i.due&&i.due>=k&&diffD(k,i.due)<=7).length;
  let items=S.fac.items.filter(i=>UI.fFilter==='todos'||i.type===UI.fFilter);
  if(!UI.fDone)items=items.filter(i=>i.status!=='feito');
  items.sort((a,b)=>(a.status==='feito')-(b.status==='feito')||byDue(a,b));
  const discs=[...new Set(S.fac.items.map(i=>i.disc).filter(Boolean))].sort();
  let h=`<div class="card stats"><div><b class="${late?'t-bad':''}">${late}</b><span>atrasados</span></div><div><b class="${soon?'t-warn':''}">${soon}</b><span>vencem em 7 dias</span></div><div><b>${open.length}</b><span>em aberto</span></div></div>`;
  h+=`<div class="card">${h2('Novo item',C.fac)}<div class="fgrid c-fac"><input class="in full" id="fq" data-enter="facadd" placeholder="O que precisa fazer? (ex.: Contestação, Prova de Civil)" autocomplete="off"><label class="f">Tipo<select class="in" id="fqt">${Object.entries(FTYPE).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label><label class="f">Disciplina<input class="in" id="fqd" list="disc-l" placeholder="Disciplina" autocomplete="off"></label><label class="f">Prazo<input class="in" id="fqp" type="date"></label><button class="btn pri" data-a="facadd">${I.plus} Adicionar</button></div><datalist id="disc-l">${discs.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></div>`;
  h+=`<div class="card">${h2('Minhas atividades',C.fac,'<span class="cnt">por prazo</span>')}<div class="chips" style="margin-bottom:10px">${[['todos','Todos'],['trabalho','Trabalhos'],['prova','Provas'],['peca','Peças'],['leitura','Leituras'],['outro','Outros']].map(([v,l])=>`<button class="chip${UI.fFilter===v?' on':''}" data-a="ff" data-v="${v}">${l}</button>`).join('')}<button class="chip${UI.fDone?' on':''}" data-a="fdn">${UI.fDone?'✓ ':''}Concluídos</button></div>${items.length?items.map(i=>fRow(i,k)).join(''):'<div class="empty">Nada por aqui.</div>'}</div>`;

};

/* ---------- LEITURA ---------- */
function bookRow(b){
  const p=bpct(b);
  const prog=b.mode==='percent'?`${fmtN(num(b.cur))}%`:(num(b.total)?`pág. ${fmtN(num(b.cur))} de ${fmtN(num(b.total))} · ${Math.round(p)}%`:`pág. ${fmtN(num(b.cur))} · defina o total de páginas`);
  return `<div class="book"><div class="row" style="align-items:flex-start"><div class="grow" data-a="bopen" data-id="${b.id}" style="cursor:pointer"><div class="ttl">${esc(b.title)}</div><div class="meta">${b.author?`<span>${esc(b.author)}</span>`:''}<span>${b.status==='lido'?'concluído':prog}</span></div></div><button class="iconbtn sm" data-a="bedit" data-id="${b.id}" aria-label="Editar livro">${I.edit}</button></div>${bar(p,C.read)}<div class="row wrap book-a">${b.status!=='lido'?`<label class="mini">${b.mode==='percent'?'Progresso %':'Página atual'} <input class="in sm" inputmode="numeric" data-c="bcur" data-id="${b.id}" value="${esc(b.cur)}"></label>`:''}<button class="btn sm" data-a="bopen" data-id="${b.id}">${I.note} Anotações (${b.notes.length})</button></div></div>`;
}
function bookView(b){
  const notes=[...b.notes].sort((a,c)=>(c.date||'').localeCompare(a.date||''));
  return `<button class="btn ghost" data-a="bback" style="margin:-6px 0 8px;padding-left:0">${I.l} Livros</button>
  <div class="card"><div class="row" style="align-items:flex-start"><div class="grow"><div class="ttl big2">${esc(b.title)}</div><div class="meta">${b.author?`<span>${esc(b.author)}</span>`:''}<span class="pill">${BST[b.status]}</span><span>${Math.round(bpct(b))}%</span></div></div><button class="iconbtn" data-a="bedit" data-id="${b.id}" aria-label="Editar livro">${I.edit}</button></div><div style="margin-top:10px">${bar(bpct(b),C.read)}</div></div>
  <div class="card">${h2('Nova anotação',C.read)}<div class="fgrid c2"><label class="f">Data<input class="in" type="date" id="nd" value="${today()}"></label><label class="f">Capítulo / página<input class="in" id="nr" placeholder="ex.: Cap. 3, p. 45"></label></div><label class="f" style="margin-top:8px">Anotação<textarea class="in" id="nt" rows="4" placeholder="Escreva sua anotação..."></textarea></label><div class="actions"><button class="btn pri" data-a="nadd" data-id="${b.id}">Salvar anotação</button></div></div>
  <div class="card">${h2(`Anotações (${notes.length})`,C.read)}${notes.length?notes.map(n=>`<div class="noteitem"><div class="row"><div class="grow meta" style="margin:0">${n.date?`<span>${fdy(n.date)}</span>`:''}${n.ref?`<b>${esc(n.ref)}</b>`:''}</div><button class="iconbtn sm" data-a="nedit" data-b="${b.id}" data-id="${n.id}" aria-label="Editar">${I.edit}</button><button class="iconbtn sm" data-a="ndel" data-b="${b.id}" data-id="${n.id}" aria-label="Apagar">${I.trash}</button></div><div class="ntext">${esc(n.text)}</div></div>`).join(''):'<div class="empty">Nenhuma anotação ainda.</div>'}</div>`;
}
V.leitura=()=>{
  if(UI.book){const b=findB(UI.book);if(b)return bookView(b);UI.book=null;}
  const now=new Date(),k=dkey(now),rl=S.read.log[k]||{m:0,d:false},g=num(S.read.goal)||1;
  const cnt=s=>S.read.books.filter(b=>b.status===s).length;
  let h=`<div class="grid g2"><div class="card">${h2('Meta diária de leitura',C.read)}<div class="row"><div class="grow"><b class="big">${rl.m||0}</b> <span class="muted">de ${fmtN(S.read.goal)} min hoje</span></div>${chk(!!rl.d,'rd',`data-date="${k}"`)}</div><div style="margin-top:10px">${bar((rl.m||0)/g*100,C.read)}</div><div class="row wrap" style="margin-top:12px">${[5,10,15,30].map(m=>`<button class="btn sm" data-a="ra" data-m="${m}">+${m} min</button>`).join('')}<button class="btn sm ghost" data-a="ra0">Zerar</button></div><div class="days7">${[6,5,4,3,2,1,0].map(i=>{const dd=addD(now,-i),l=S.read.log[dkey(dd)];return `<div class="d7${l&&l.d?' on':''}${i===0?' t':''}"><i></i><span>${DC[wd(dd)]}</span></div>`;}).join('')}</div><label class="f row" style="margin-top:14px">Meta (minutos por dia)<input class="in w90" inputmode="numeric" data-c="rgoal" value="${esc(S.read.goal)}"></label></div>`;
  h+=`<div class="card">${h2('Resumo',C.read)}<div class="stats"><div><b>${cnt('lendo')}</b><span>lendo</span></div><div><b>${cnt('quero')}</b><span>quero ler</span></div><div><b>${cnt('lido')}</b><span>lidos</span></div></div><div class="small muted" style="margin-top:14px">Minutos lidos nos últimos 7 dias: <b>${fmtN(sum([0,1,2,3,4,5,6].map(i=>(S.read.log[dkey(addD(now,-i))]||{}).m||0)))}</b></div><div class="small muted">Anotações: <b>${sum(S.read.books.map(b=>b.notes.length))}</b></div></div></div>`;
  h+=`<div class="card">${h2('Meus livros',C.read,'<button class="more" data-a="bnew">+ Livro</button>')}`;
  ['lendo','quero','lido'].forEach(s=>{const bs=S.read.books.filter(b=>b.status===s);if(bs.length)h+=`<div class="sublbl">${BST[s]}</div>`+bs.map(bookRow).join('');});
  if(!S.read.books.length)h+='<div class="empty">Nenhum livro cadastrado.</div>';
  return h+'</div>';
};

/* ---------- EXERCÍCIOS ---------- */

  h+=`<div class="sublbl">Adicionar exercício</div><div class="fgrid c-ex"><input class="in" id="gn" data-enter="gadd" placeholder="Exercício (ex.: Supino reto)" autocomplete="off"><input class="in" id="gs" inputmode="numeric" placeholder="Séries" data-enter="gadd"><input class="in" id="gr" placeholder="Reps" data-enter="gadd"><input class="in" id="gc" placeholder="Carga" data-enter="gadd"><button class="btn pri" data-a="gadd" aria-label="Adicionar">${I.plus}</button></div>`;
  if(plan.length){const dn=!!S.gym.done[dk];h+=`<div class="donebar">${dk>k?`<span class="small muted">Você poderá marcar como feito em ${fd(dk)}.</span>`:`<button class="btn ${dn?'':'pri'} wide" data-a="gd" data-date="${dk}" data-d="${d}">${dn?`✓ Treino de ${fd(dk)} concluído · desfazer`:`Marcar treino de ${fd(dk)} como feito`}</button>`}</div>`;}
  h+='</div>';
  h+=`<div class="card">${h2('Histórico de treinos',C.gym)}${[0,1,2,3,4,5,6,7].map(i=>{const s=pk(wStart(addD(now,-7*i))),ds=D7.map(j=>dkey(addD(s,j-1))),n=ds.filter(x=>S.gym.done[x]).length;
    return `<div class="hist"><div class="grow"><b>${i===0?'Esta semana':fd(s)+' a '+fd(addD(s,6))}</b><div class="small muted">${plural(n,'treino concluído','treinos concluídos')}</div></div><div class="sq">${ds.map((x,j)=>`<i class="${S.gym.done[x]?'on':''}" title="${DC[j+1]}"></i>`).join('')}</div></div>`;}).join('')}</div>`;

/* ---------- ALIMENTAÇÃO ---------- */
function ftRows(q){
  const list=q?findFoods(q,FOODS):FOODS;
  return list.map(f=>`<div class="ent"><span class="grow">${esc(f.n)}</span><span class="small muted" style="text-align:right">${fmtN(f.k100)} kcal/100 ${f.liq?'ml':'g'}${f.units[1]?`<br>${esc(f.units[1].l)}: ${fmtN(f.units[1].k)} kcal`:''}</span></div>`).join('')||'<div class="empty">Nenhum alimento encontrado.</div>';
}
V.alimentacao=()=>{
  const k=UI.fDate,t=today(),ents=S.food.meals[k]||[],kc=sum(ents.map(e=>e.kcal)),goal=num(S.food.goal);
  const B=S.body,cw=curW(),gw=num(B.goalWeight),sw=num(B.startWeight)||cw,bN=bmiOf(cw),bG=bmiOf(gw),T0=tmb(cw),gasto=T0*num(B.act||1.2);
  const lost=sw-cw,need=sw-gw,left=Math.max(0,cw-gw),ppct=need>0?lost/need*100:0;
  const def=goal?gasto-goal:0,kgw=def>0?def*7/7700:0,weeks=kgw>0&&left>0?Math.ceil(left/kgw):0;
  let h=`<div class="card">${h2('Meu corpo','var(--accent)','<button class="more" data-a="bodyedit">Editar perfil</button>')}<div class="avs"><div class="av">${avatar(bN,false)}<b>${fmtN(cw,1)} kg</b><span>hoje</span></div><div class="arr">→</div><div class="av">${avatar(bG,true)}<b>${fmtN(gw,1)} kg</b><span>meta</span></div></div>`;
  h+=left>0?`<div class="row small" style="margin-top:6px"><span class="grow muted">${lost>0?`Já foram ${fmtN(lost,1)} kg`:`Início: ${fmtN(sw,1)} kg`}</span><b>Faltam ${fmtN(left,1)} kg</b></div><div style="margin-top:6px">${bar(ppct,'var(--accent)')}</div>`:`<div class="calc" style="text-align:center"><b>Meta de ${fmtN(gw,1)} kg atingida! 🎉</b></div>`;
  h+=`<div class="bstats"><div><b>${(num(B.height)/100).toFixed(2).replace('.',',')} m</b><span>altura</span></div><div><b>${fmtN(num(B.age))}</b><span>anos</span></div><div><b>${fmtN(bN,1)}</b><span>IMC (${bmiCat(bN)})</span></div><div><b>${fmtN(bG,1)}</b><span>IMC na meta</span></div><div><b>${fmtN(T0)}</b><span>TMB (kcal)</span></div><div><b>${fmtN(gasto)}</b><span>gasto/dia (kcal)</span></div></div>`;
  h+=`<div class="calc">${goal?(def>0?`Meta de <b>${fmtN(goal)} kcal</b> − gasto de ~${fmtN(gasto)} kcal = déficit de <b>~${fmtN(def)} kcal/dia</b> ≈ <b>${fmtN(kgw,2)} kg/semana</b>${weeks?` → ${fmtN(left,1)} kg em <b>~${weeks} semanas</b>`:''}.`:`Com a meta de ${fmtN(goal)} kcal não há déficit em relação ao gasto estimado (~${fmtN(gasto)} kcal).`):'Defina a meta calórica para ver a estimativa.'}${goal&&goal<T0?' A meta calórica está abaixo da sua TMB estimada.':''}${bG<18.5?' O peso meta fica abaixo da faixa adequada de IMC.':''}<br><span class="muted small">Estimativa teórica (fórmula de Mifflin-St Jeor e ~7.700 kcal por kg). Retenção de líquido e ciclo menstrual mexem na balança de um dia para o outro.</span></div></div>`;
  h+=`<div class="toolbar"><div class="row"><button class="iconbtn" data-a="fdt" data-d="-1" aria-label="Dia anterior">${I.l}</button><div class="wkl"><div class="small muted">${k===t?'Hoje':DOWF[pk(k).getDay()]}</div><b>${fdy(k)}</b></div><button class="iconbtn" data-a="fdt" data-d="1" aria-label="Próximo dia">${I.r}</button>${k!==t?'<button class="btn sm ghost" data-a="fdt" data-d="0">Hoje</button>':''}</div><button class="btn pri" data-a="foodadd" data-date="${k}">${I.plus} Registrar alimento</button></div>`;
  h+=`<div class="card"><div class="kcal3"><div><b>${fmtN(kc)}</b><span>consumidas</span></div><div><b>${goal?fmtN(goal):'–'}</b><span>meta (kcal)</span></div><div><b class="${goal&&kc>goal?'t-warn':''}">${goal?fmtN(Math.abs(goal-kc)):'–'}</b><span>${goal&&kc>goal?'acima da meta':'faltam'}</span></div></div>${goal?bar(kc/goal*100,kc>goal?'var(--warn)':C.food):'<div class="small muted" style="text-align:center">Defina sua meta calórica em Configurações (no fim da página).</div>'}</div>`;
  const other=ents.filter(e=>!S.food.slots.includes(e.meal));
  h+=`<div class="card">${h2('Refeições',C.food)}${S.food.slots.map(s=>{const se=ents.filter(e=>e.meal===s);
    return `<div class="meal"><div class="row"><span class="dot" style="--c:${C.food}"></span><b class="grow">${MEALS[s]}</b><span class="small muted">${fmtN(sum(se.map(e=>e.kcal)))} kcal</span><button class="iconbtn sm" data-a="foodadd" data-meal="${s}" data-date="${k}" aria-label="Adicionar em ${MEALS[s]}">${I.plus}</button></div>${se.map(e=>`<div class="ent"><span class="grow">${esc(e.name)} <span class="muted small">· ${fmtN(e.qty,2)} ${esc(e.unit)}</span></span><b>${fmtN(e.kcal)}</b><button class="x" data-a="edel" data-date="${k}" data-id="${e.id}" aria-label="Remover">${I.x}</button></div>`).join('')}</div>`;}).join('')}${other.length?`<div class="meal"><b>Outras refeições</b>${other.map(e=>`<div class="ent"><span class="grow">${esc(e.name)} <span class="muted small">· ${MEALS[e.meal]||''}</span></span><b>${fmtN(e.kcal)}</b><button class="x" data-a="edel" data-date="${k}" data-id="${e.id}" aria-label="Remover">${I.x}</button></div>`).join('')}</div>`:''}</div>`;
  const wts=[...S.food.weights].sort((a,b)=>a.date.localeCompare(b.date));
  h+=`<div class="grid g2"><div class="card">${h2('Peso semanal',C.food,`<span class="cnt">meta ${fmtN(num(S.body.goalWeight),1)} kg</span>`)}<div class="fgrid c-w"><input class="in" type="date" id="pwd" value="${t}" aria-label="Data"><input class="in" id="pwk" inputmode="decimal" placeholder="Peso (kg)" data-enter="pwadd"><button class="btn pri" data-a="pwadd">Registrar</button></div><div style="margin-top:12px">${lineChart(wts.slice(-12).map(w=>({l:fd(w.date),v:num(w.kg)})),C.food,num(S.body.goalWeight))}</div>${wts.length?wts.slice().reverse().slice(0,6).map(w=>`<div class="ent"><span class="grow">${fdy(w.date)}</span><b>${fmtN(num(w.kg),1)} kg</b><button class="x" data-a="pdel" data-id="${w.id}" aria-label="Remover">${I.x}</button></div>`).join(''):''}</div>`;
  h+=`<div class="card">${h2('Meus alimentos',C.food,'<button class="more" data-a="cnew">+ Novo</button>')}${S.food.custom.length?S.food.custom.map(c=>`<div class="ent"><span class="grow" data-a="cedit" data-id="${c.id}" style="cursor:pointer">${esc(c.n)} <span class="muted small">· ${esc(c.pl||'porção')}</span></span><b>${fmtN(num(c.k))} kcal</b></div>`).join(''):'<div class="empty">Cadastre alimentos que não estão na tabela (ex.: a marmita da empresa), informando as calorias por porção.</div>'}</div></div>`;
  h+=`<div class="card"><details><summary class="h2" style="margin:0;cursor:pointer;list-style:none"><span class="dot" style="--c:${C.food}"></span>Tabela de alimentos (${FOODS.length})<span class="more">ver ›</span></summary><input class="in" style="margin:12px 0 4px" data-i="ftsearch" placeholder="Buscar alimento..." autocomplete="off"><div id="ftl" style="max-height:420px;overflow:auto">${ftRows('')}</div></details></div>`;
  h+=`<div class="card">${h2('Configurações',C.food)}<label class="f row">Meta calórica diária (kcal)<input class="in w120" inputmode="numeric" data-c="fgoal" value="${esc(S.food.goal)}" placeholder="kcal"></label><div class="sublbl">Refeições acompanhadas</div><div class="chips">${Object.entries(MEALS).map(([s,l])=>`<button class="chip${S.food.slots.includes(s)?' on':''}" data-a="fslot" data-s="${s}">${l}</button>`).join('')}</div><p class="small muted" style="margin-bottom:0">As calorias da tabela interna são médias aproximadas (referência TACO/USDA) e servem como estimativa. Preparos com óleo, molhos e marcas variam.</p></div>`;
  return h;
};

/* ---------- CHÁ E ÁGUA ---------- */
V.agua=()=>{
  const now=new Date(),k=dkey(now),w=wd(now),wg=waterGoal(),wl=waterLog(k),p=Math.min(1,wl.ml/wg),kg=curW(),ml=num(S.water.mlkg)||35;

  h+=`<div class="wbtns">${[[150,'xícara'],[250,'copo'],[350,'copo grande'],[500,'garrafa']].map(([m,l])=>`<button class="btn" data-a="aw" data-ml="${m}">+${m}<small>${l}</small></button>`).join('')}</div><div class="row" style="margin-top:10px"><input class="in" id="awc" inputmode="numeric" placeholder="Outra quantidade (ml)" data-enter="awc"><button class="btn" data-a="awc">Somar</button></div><div class="row" style="margin-top:8px"><button class="btn sm ghost" data-a="awu"${wl.adds&&wl.adds.length?'':' disabled'}>Desfazer último</button><button class="btn sm ghost" data-a="aw0">Zerar hoje</button></div></div>`;
  const days=[6,5,4,3,2,1,0].map(i=>{const d=addD(now,-i);return{l:DC[wd(d)],v:waterLog(dkey(d)).ml};});
  const tp=S.tea.plan[w]||{},td=S.tea.done[k]||{};

  const ws=pk(wStart(now)),wkDone=sum(D7.map(i=>{const x=S.tea.done[dkey(addD(ws,i-1))]||{};return (x.m?1:0)+(x.n?1:0);}));

/* ================== modal, formulários, toast ================== */
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;document.body.classList.add('noscroll');}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';document.body.classList.remove('noscroll');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300);}
const isDesk=()=>matchMedia('(min-width:700px)').matches;

function openForm(o){
  const d=o.data||{};
  const fields=o.fields.map(fl=>{
    const v=d[fl.k]??fl.def??'';let inp;
    if(fl.type==='textarea')inp=`<textarea class="in" name="${fl.k}" rows="${fl.rows||4}" placeholder="${esc(fl.ph||'')}">${esc(v)}</textarea>`;
    else if(fl.type==='select')inp=`<select class="in" name="${fl.k}">${fl.opts.map(([ov,ol])=>`<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`).join('')}</select>`;
    else if(fl.type==='days')inp=`<div class="chips" data-days="${fl.k}">${D7.map(x=>`<button type="button" class="chip${(v||[]).includes(x)?' on':''}" data-d="${x}">${DC[x]}</button>`).join('')}</div>`;
    else inp=`<input class="in" name="${fl.k}" type="${fl.type==='number'?'text':(fl.type||'text')}" ${fl.type==='number'?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(fl.ph||'')}" ${fl.list?`list="${fl.list}"`:''} autocomplete="off">`;
    return `<label class="f">${fl.label}${inp}</label>`;
  }).join('');
  openModal(`<form id="mf" novalidate><h3>${o.title}</h3><div class="fgrid">${fields}</div>${o.extra||''}<div class="actions">${o.onDelete?'<button type="button" class="btn danger" id="mf-del">Excluir</button><span class="grow"></span>':''}<button type="button" class="btn" data-a="close">Cancelar</button><button class="btn pri" type="submit">${o.save||'Salvar'}</button></div></form>`);
  const form=$('#mf');
  $$('[data-days] .chip',form).forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on')));
  form.addEventListener('submit',e=>{
    e.preventDefault();const vals={};
    for(const fl of o.fields){
      if(fl.type==='days'){vals[fl.k]=$$(`[data-days="${fl.k}"] .chip.on`,form).map(c=>+c.dataset.d);continue;}
      let x=form.elements[fl.k].value;x=fl.type==='number'?(x.trim()===''?'':num(x)):x.trim();vals[fl.k]=x;
      if(fl.req&&(x===''||x==null)){toast(`Preencha: ${fl.label}`);form.elements[fl.k].focus();return;}
    }
    if(o.onSave(vals)===false)return;closeModal();commit();
  });
  if(o.onDelete)$('#mf-del').addEventListener('click',()=>{if(confirm(o.delMsg||'Excluir este item?')){o.onDelete();closeModal();commit();}});
  if(isDesk()&&!o.noFocus)setTimeout(()=>{const f=form.querySelector('input:not([type=date]),textarea');f&&f.focus();},60);
}

/* ---------- busca e registro de alimentos ---------- */
function sing(t){if(t.length>3&&/(oes|aes)$/.test(t))return t.slice(0,-3)+'ao';if(t.length>3&&t.endsWith('s'))return t.slice(0,-1);return t;}
function allFoods(){return S.food.custom.map(c=>({n:c.n,custom:true,units:[{l:c.pl||'porção',k:num(c.k)},...(c.extra||[]).map(([l,k])=>({l,k:num(k)}))]})).concat(FOODS);}
function findFoods(q,src){
  const toks=norm(q).split(/[\s,]+/).filter(t=>t&&!['de','com','do','da','e'].includes(t)).map(sing);
  if(!toks.length)return[];const out=[];
  (src||allFoods()).forEach((f,idx)=>{const hay=norm(f.n+' '+(f.a||''));
    if(toks.every(t=>hay.includes(t))){let sc=idx;if(norm(f.n).startsWith(toks[0]))sc-=1000;if(f.custom)sc-=2000;out.push([sc,f]);}});
  return out.sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
function parseFood(txt){
  const m=txt.match(/^\s*(\d+(?:[.,]\d+)?)\s*(kg|g|gr|gramas?|ml|l|litros?)?\s+(?:de\s+)?(.+)$/i);
  if(!m)return{qty:null,unit:null,q:txt.trim()};
  const u=(m[2]||'').toLowerCase();
  return{qty:num(m[1])*(/^(kg|l|litros?)$/.test(u)?1000:1),unit:u?(/^(ml|l|litros?)$/.test(u)?'ml':'g'):null,q:m[3].trim()};
}

  <div id="fa-man" hidden style="margin-top:8px" class="fgrid"><label class="f">Calorias desta quantidade (kcal)<input class="in" id="fa-kcal" inputmode="decimal" placeholder="kcal"></label><label class="cb"><input type="checkbox" id="fa-save" checked> Salvar em “Meus alimentos” para as próximas vezes</label></div>
  <div class="est" id="fa-est">Digite um alimento para ver a estimativa.</div><div class="added" id="fa-added"></div>
  <div class="actions"><button type="button" class="btn" data-a="close">Fechar</button><button type="button" class="btn" id="fa-more">Adicionar e continuar</button><button type="button" class="btn pri" id="fa-ok">Adicionar</button></div>`);
  const fi=$('#fa-food'),qi=$('#fa-qty'),ui=$('#fa-unit'),sug=$('#fa-sug'),man=$('#fa-man'),ki=$('#fa-kcal'),est=$('#fa-est');
  const calc=()=>{
    if(sel){const u=sel.units[+ui.value]||sel.units[0];const k=u.k*num(qi.value);est.innerHTML=`<b>${esc(sel.n)}</b>: ≈ <b>${fmtN(k)}</b> kcal`;return k;}
    if(!fi.value.trim()){est.textContent='Digite um alimento para ver a estimativa.';return 0;}
    const k=num(ki.value);est.innerHTML=k?`<b>${fmtN(k)}</b> kcal (informado por você)`:'Não encontrei na tabela. Informe as calorias abaixo.';return k;
  };
  const setFood=(f,qty,uh)=>{
    sel=f;
    if(f){ui.innerHTML=f.units.map((u,i)=>`<option value="${i}">${esc(u.l)}</option>`).join('');let ix=!f.custom&&f.units.length>1&&!uh?1:0;ui.value=String(ix);
      qi.value=qty!=null?String(qty).replace('.',','):(ix===0&&!f.custom?'100':'1');man.hidden=true;}
    else{ui.innerHTML=MANU.map((u,i)=>`<option value="${i}">${u}</option>`).join('');if(uh)ui.value=String(MANU.indexOf(uh));if(qty!=null)qi.value=String(qty).replace('.',',');man.hidden=false;}
    calc();
  };
  const drawSug=(on)=>{
    const p=parseFood(fi.value);
    sug.innerHTML=list.slice(0,5).map((f,i)=>{const u=f.units[f.units.length>1&&!f.custom?1:0];return `<button type="button" class="sg${f===on?' on':''}" data-i="${i}">${esc(f.n)}<span>${f.custom?'meu · ':''}${fmtN(u.l==='g'||u.l==='ml'?u.k*100:u.k)} kcal/${u.l==='g'||u.l==='ml'?'100 '+u.l:esc(u.l.replace(/ \(.*/,''))}</span></button>`;}).join('')+(p.q?`<button type="button" class="sg${!on?' on':''}" data-i="-1">Usar “${esc(p.q)}” e informar as calorias</button>`:'');
  };
  fi.addEventListener('input',()=>{
    const p=parseFood(fi.value);list=p.q?findFoods(p.q):[];const best=list[0]||null;
    if(best!==sel||p.qty!=null)setFood(best,p.qty,p.unit);else calc();
    drawSug(sel);if(!p.q)sug.innerHTML='';
  });
  sug.addEventListener('click',e=>{const b=e.target.closest('.sg');if(!b)return;const i=+b.dataset.i;const p=parseFood(fi.value);setFood(i>=0?list[i]:null,p.qty,p.unit);drawSug(sel);if(!sel)ki.focus();});
  qi.addEventListener('input',calc);ui.addEventListener('change',calc);ki.addEventListener('input',calc);
  const add=keep=>{
    const p=parseFood(fi.value);if(!p.q){toast('Digite o alimento');fi.focus();return;}
    const qty=num(qi.value)||1,k=calc();
    if(!sel&&!k){toast('Informe as calorias');ki.focus();return;}
    const unit=sel?(sel.units[+ui.value]||sel.units[0]).l:MANU[+ui.value]||'porção';
    const name=sel?sel.n:p.q.charAt(0).toUpperCase()+p.q.slice(1);
    const m=$('#fa-meal').value;
    (S.food.meals[date]=S.food.meals[date]||[]).push({id:uid(),meal:m,name,qty,unit,kcal:Math.round(k)});
    (S.food.done[date]=S.food.done[date]||{})[m]=true;
    if(!sel&&$('#fa-save').checked&&!S.food.custom.some(c=>norm(c.n)===norm(name)))S.food.custom.push({id:uid(),n:name,pl:unit==='porção'?'porção':`${fmtN(qty,2)} ${unit}`,k:Math.round(k)});
    save();render();
    if(keep){added.push(`${name} (${fmtN(Math.round(k))} kcal)`);$('#fa-added').textContent='✓ Adicionado: '+added.join(', ');fi.value='';ki.value='';qi.value='1';sel=null;list=[];sug.innerHTML='';man.hidden=true;calc();fi.focus();}
    else{closeModal();toast(`${name}: ${fmtN(Math.round(k))} kcal`);}
  };
  $('#fa-ok').addEventListener('click',()=>add(false));$('#fa-more').addEventListener('click',()=>add(true));
  fi.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add(false);}});
  setTimeout(()=>fi.focus(),80);
}

function addWater(m){const k=today(),l=S.water.log[k]||(S.water.log[k]={ml:0,adds:[]}),g=waterGoal(),was=l.ml>=g;l.adds=l.adds||[];l.ml+=m;l.adds.push(m);if(!was&&l.ml>=g)toast('Meta de água atingida! 💧');else toast(`+${m} ml`);commit();}

/* ---------- backup ---------- */
async function exportData(){
  const json=JSON.stringify(S,null,2),name=`organiza-backup-${today()}.json`;
  const mark=()=>{S.meta.lastExport=today();commit();};
  try{
    const file=new File([json],name,{type:'application/json'});
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Organiza'});mark();toast('Backup exportado');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);mark();toast('Backup exportado');
}
function importJSON(txt){
  let d;try{d=JSON.parse(txt);}catch(e){toast('Arquivo inválido');return;}
  if(!d||typeof d!=='object'||!(d.work||d.fac||d.read||d.food)){toast('Este arquivo não parece um backup do app');return;}
  if(!confirm('Substituir TODOS os dados atuais pelos do backup?'))return;
  S=merge(defaults(),d);migrate();closeModal();commit();toast('Backup importado');
}

  $$('.side [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  const inMore=MORE.includes(t);
  $('#nav').innerHTML=PRIMARY.map(p=>`<button data-a="go" data-tab="${p}" class="${p===t?'active':''}">${I[p]}<span>${TITLE[p]}</span></button>`).join('')+`<button data-a="moremenu" class="${inMore?'active':''}">${inMore?I[t]:I.mais}<span>${inMore?(t==='ajustes'?'Backup':TITLE[t]):'Mais'}</span></button>`;
  const n=new Date();
  $('#ttl').textContent=TITLE[t];
  $('#sub').textContent=t==='hoje'?'Seu dia em um lugar só':`${DOWF[n.getDay()]}, ${n.getDate()} de ${MES[n.getMonth()]}`;
  $('#view').innerHTML=(V[t]||V.hoje)();
  if(UI.focus){const el=$(UI.focus);UI.focus=null;if(el)el.focus({preventScroll:true});}
}

/* ================== eventos globais ================== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&CH[el.dataset.c])CH[el.dataset.c](el);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el&&IN[el.dataset.i])IN[el.dataset.i](el);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return;}
  if(e.key==='Enter'&&!e.isComposing){const el=e.target.closest('[data-enter]');if(el){e.preventDefault();A[el.dataset.enter](el,e);}
    else if(e.target.matches('input[data-c]')){e.target.blur();}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
if(mq.addEventListener)mq.addEventListener('change',()=>{if(S.theme==='auto')applyTheme();});
function dayCheck(){
  if(UI.day!==today()){const n=new Date();UI.day=today();UI.fDate=today();UI.wWeek=wStart(n);UI.wDay=wd(n);UI.gDay=wd(n);render();return true;}
  return false;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!dayCheck()&&UI.tab==='hoje'&&$('#modal').hidden)render();}else save();});
window.addEventListener('pagehide',save);
setInterval(()=>{if(dayCheck())return;const a=document.activeElement;if(UI.tab==='hoje'&&$('#modal').hidden&&!(a&&a.matches('input,textarea,select')))render();},60000);

/* ================== início ================== */
load();buildNav();render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
